<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e38"><title>Gonvill · Promotores</title>
<style>
:root{--ink:#183b35;--muted:#6f7c78;--green:#126751;--line:#e0e8e3;--bg:#f3f6f3;--gold:#ddaa52;--danger:#a33d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 15px;color:var(--ink);font-weight:600}button:hover{border-color:var(--green);background:#edf6f0}button.primary{background:var(--green);color:white;border-color:var(--green)}button.danger{color:var(--danger)}button:disabled{opacity:.5;cursor:wait}input,select,textarea{border:1px solid #ccd9d1;padding:11px;border-radius:8px;width:100%;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}h1,h2,h3,p{margin-top:0}h1{font-size:29px;letter-spacing:-.8px;margin-bottom:6px}h2{font-size:20px}h3{font-size:16px;margin-bottom:7px}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--green)}.small{font-size:12px}.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{background:#123e38;color:#dbe9e3;padding:30px 19px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{color:white;font-size:28px;font-weight:800;letter-spacing:-1px}.brand span{color:#e7bf6a}.brand-sub{font-size:11px;letter-spacing:2.3px;text-transform:uppercase;margin:0 0 38px}.nav{display:grid;gap:6px}.nav button{text-align:left;background:none;border-color:transparent;color:#b5d0c5;padding:12px}.nav button.active{background:#28564b;color:white}.account{margin-top:auto;padding:20px 9px 0;border-top:1px solid #376053}.account button{margin-top:12px;font-size:12px;background:transparent;color:white;border-color:#5a7a70}main{padding:30px 42px;max-width:1580px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:34px}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#e7eeea;font-size:11px;letter-spacing:.3px;font-weight:700}.APROBADA{background:#d9efdf;color:#22653e}.ENVIADA,.EN_REVISION{background:#fff0cf;color:#815715}.OBSERVACIONES{background:#fce5d6;color:#914916}.RECHAZADA{background:#f8dedd;color:#923d38}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.stat strong{display:block;font-size:30px;margin-top:9px;font-weight:650}.stat span{font-size:12px;color:var(--muted)}.stat.accent{background:#e7efe8}.card{margin-bottom:18px}.card.school{border-top:3px solid #b6ccb8}.empty{padding:40px;text-align:center;border:1px dashed #c4d5c9;border-radius:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:12px 9px;border-bottom:1px solid var(--line)}td{padding:15px 9px;border-bottom:1px solid #edf1ed;vertical-align:top}td input,td select{min-width:95px;padding:8px}td textarea{min-width:140px;font-size:12px;min-height:65px}td.title{min-width:210px}td .small{display:block}.toolbar{margin:20px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}.toolbar select{max-width:210px}.notice{background:#fff5dd;border:1px solid #efdfaf;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:13px}.info{background:#e8f2eb;border-color:#c5ddcc}.steps{display:flex;gap:8px;margin:25px 0;flex-wrap:wrap}.steps span{background:#e9eeea;border-radius:6px;padding:8px 14px;font-size:12px}.steps .current{background:#d2e8d8;color:#275c38;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.check{display:flex;gap:9px;align-items:flex-start;font-weight:400}.check input{width:18px;margin-top:4px;flex-shrink:0}a{color:var(--green)}.login-wrap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.login-art{padding:70px;background:#123e38;color:#ecf4ee;display:flex;flex-direction:column;justify-content:center}.login-art h1{font-size:47px;line-height:1.15;max-width:520px;margin:45px 0 20px}.login-art p{max-width:440px;color:#bad1c4}.login-form{max-width:500px;width:100%;padding:45px;margin:auto}.login-form form{display:grid;gap:15px}.login-form h2{font-size:27px;margin-top:12px}.statusline{margin-top:18px;font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:24px;right:24px;z-index:20;background:#173e34;color:white;max-width:500px;padding:16px 20px;border-radius:10px;box-shadow:0 5px 25px #0002;display:none}#busy{position:fixed;top:0;left:0;right:0;height:4px;z-index:30;background:linear-gradient(90deg,#ddaa52,#126751);display:none}.history{border-left:2px solid #d3e1d5;padding-left:18px;margin:15px 0}.history p{margin:0 0 18px}.search-results{max-height:390px;overflow:auto}.result{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:15px;justify-content:space-between;align-items:center}.result button{white-space:nowrap}.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:18px}.bad{color:var(--danger)}.school-select{max-width:350px}.print-only{display:none}@media(max-width:1000px){main{padding:24px}.layout{grid-template-columns:190px 1fr}.stats{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:700px){.layout{display:block}aside{height:auto;position:relative;padding:15px}.brand{font-size:23px}.brand-sub{margin:0 0 14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.account{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:12px;font-size:12px}.account button{margin:0}.grid.two,.grid.three{grid-template-columns:1fr}.login-wrap{display:block}.login-art{padding:28px}.login-art h1{font-size:28px;margin:18px 0}.login-art p{display:none}.login-form{padding:28px}.topbar{margin-bottom:20px;align-items:flex-start}main{padding:20px 15px}h1{font-size:25px}.card{padding:16px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:26px}}@media print{aside,.topbar,.no-print,#toast,#busy,.actions{display:none!important}.layout{display:block}main{padding:0;max-width:none}.card{border:0;padding:8px;margin-bottom:8px}.print-only{display:block}.table-wrap{overflow:visible}input,select,textarea{border:0;padding:0;appearance:none}body{background:white;font-size:11px}.notice{font-size:11px}td{padding:7px}h1{font-size:22px}.stats{display:none}}
</style></head><body><div id="busy"></div><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Opcional: pega aquí la URL pública /exec. También puedes configurarla desde la pantalla de acceso.
const API_URL = '';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const labels={BORRADOR:'Borrador',ENVIADA:'Enviada a Compras',EN_REVISION:'En revisión',OBSERVACIONES:'Con observaciones',APROBADA:'Aprobada',RECHAZADA:'Rechazada'};
let state={user:null,schools:[],quotes:[],users:[],page:'home',school:'',filter:'',query:'',demo:false,quote:null,books:[],catalogQuery:'',catalogField:'titulo',pending:false,dirty:false};
let token=sessionStorage.getItem('gp_token')||'',endpoint=API_URL||localStorage.getItem('gp_endpoint')||'';
const badge=s=>`<span class="pill ${esc(s)}">${esc(labels[s]||s)}</span>`,when=s=>s?new Date(s).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(s,error=false){$('toast').textContent=s;$('toast').style.background=error?'#853d35':'#173e34';$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',6500);}
async function api(action,data={}){if(state.demo)return demoApi(action,data);if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint))throw Error('Configura una URL válida de Apps Script terminada en /exec.');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);$('busy').style.display='block';
 try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data}),signal:controller.signal,redirect:'follow',credentials:'omit'});const text=await response.text();let r;try{r=JSON.parse(text);}catch{throw Error('El servicio no devolvió JSON. Revisa que el despliegue permita acceso a Cualquier persona y usa la URL /exec.');}if(!r.ok){if(r.code==='AUTH'&&action!=='login'){token='';sessionStorage.removeItem('gp_token');state.user=null;renderLogin();}throw Error(r.error||'No se pudo completar la operación.');}return r.data;
 }catch(e){if(e.name==='AbortError')throw Error('La operación tardó demasiado. Recarga para comprobar si se guardó antes de repetirla.');if(e instanceof TypeError)throw Error('No se pudo conectar. Verifica la URL, el acceso del despliegue y tu conexión.');throw e;}finally{clearTimeout(timer);$('busy').style.display='none';}}
function renderLogin(){state.user=null;$('app').innerHTML=`<div class="login-wrap"><div class="login-art"><div class="brand">gonvill<span>.</span></div><div class="eyebrow" style="color:#dfbd79">SchoolShop · Promotores</div><h1>Del colegio<br>a una propuesta<br>bien revisada.</h1><p>Captura los libros que necesitan. Confirma la precotización. Da seguimiento con Compras, en un solo lugar.</p><div class="small" style="color:#b5d0c5">PRIMERA VERSIÓN · PILOTO EN GOOGLE SHEETS</div></div><div class="login-form"><span class="eyebrow">Tu espacio de trabajo</span><h2>Bienvenido de nuevo</h2><p class="muted">Accede con el usuario que te asignó Administración.</p><form id="login"><div><label for="username">Usuario</label><input id="username" autocomplete="username" required></div><div><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Entrar al sistema</button></form><details style="margin-top:22px"><summary>Configurar conexión con Sheets</summary><label for="endpoint" style="margin-top:15px">URL del servicio Apps Script (/exec)</label><input id="endpoint" value="${esc(endpoint)}" placeholder="https://script.google.com/macros/s/…/exec"><button id="saveEndpoint" style="margin-top:10px">Guardar conexión</button><p class="small muted">Aquí solo se guarda la dirección del servicio, nunca la contraseña.</p></details><div class="statusline">¿Quieres conocer la app antes de conectarla?</div><button id="demo" style="margin-top:9px">Abrir demostración local</button><p class="small muted" style="margin-top:12px">La demostración usa datos ficticios guardados en este navegador.</p></div></div>`;
 $('saveEndpoint').onclick=()=>{endpoint=$('endpoint').value.trim();localStorage.setItem('gp_endpoint',endpoint);toast('Dirección guardada.');};$('demo').onclick=startDemo;
 $('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await api('login',{username:$('username').value,password:$('password').value});token=r.token;sessionStorage.setItem('gp_token',token);await load();}catch(err){toast(err.message,true);}finally{b.disabled=false;}};}
async function load(){const data=await api('bootstrap');Object.assign(state,data);render();}
function nav(page,school=''){if(state.dirty&&!confirm('Hay cambios sin guardar. ¿Quieres salir de esta pantalla?'))return;state.dirty=false;state.page=page;state.school=school;state.query='';state.filter='';render();}
function render(){if(!state.user)return renderLogin();const u=state.user;$('app').innerHTML=`<div class="layout"><aside><div class="brand">gonvill<span>.</span></div><div class="brand-sub">Promotores</div><nav class="nav">${[['home','Inicio'],['schools','Colegios'],['quotes','Precotizaciones'],...(u.role!=='PROMOTOR'?[['reviews','Revisión de Compras']]:[]),['catalog','Catálogo']].map(([p,t])=>`<button data-nav="${p}" class="${state.page===p?'active':''}">${t}</button>`).join('')}</nav><div class="account"><div><strong>${esc(u.name)}</strong><br><span>${esc(u.role)}</span></div><button id="logout">Cerrar sesión</button></div></aside><main><div class="topbar"><div><span class="eyebrow">Gonvill SchoolShop</span><div class="small muted">Gestión de precotizaciones escolares</div></div><div class="row">${state.demo?'<span class="pill OBSERVACIONES">DEMO · DATOS FICTICIOS</span>':'<span class="pill APROBADA">Conectado a Sheets</span>'}<button id="refresh" title="Actualizar datos">Actualizar</button></div></div>${state.demo?`<div class="notice no-print">Demostración local. Estos datos no se envían a Sheets. <label style="display:inline" for="demoRole">Probar como:</label> <select id="demoRole" style="width:auto;padding:5px"><option ${u.role==='ADMIN'?'selected':''}>ADMIN</option><option ${u.role==='PROMOTOR'?'selected':''}>PROMOTOR</option><option ${u.role==='COMPRAS'?'selected':''}>COMPRAS</option></select></div>`:''}<div id="content"></div><p class="small muted no-print" style="margin-top:30px">Promotores v1.0 · Una precotización aprobada aún no es una orden de compra.</p></main></div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('logout').onclick=async()=>{if(state.dirty&&!confirm('¿Cerrar sesión y descartar cambios sin guardar?'))return;try{if(!state.demo)await api('logout');}catch{}token='';sessionStorage.removeItem('gp_token');state.demo=false;state.dirty=false;renderLogin();};$('refresh').onclick=async()=>{if(state.dirty&&!confirm('¿Descartar cambios sin guardar y actualizar?'))return;state.dirty=false;try{if(state.page==='editor'&&state.quote?.version){state.quote=await api('getQuote',{id:state.quote.id});await load();}else await load();toast('Datos actualizados.');}catch(e){toast(e.message,true);}};
 if($('demoRole'))$('demoRole').onchange=async e=>{if(state.dirty&&!confirm('¿Descartar cambios sin guardar?')){render();return;}state.dirty=false;state.user=demoUser(e.target.value);state.page='home';await load();};
 const routes={home:renderHome,schools:renderSchools,quotes:renderQuotes,reviews:renderQuotes,catalog:renderCatalog,editor:renderEditor};(routes[state.page]||renderHome)();}
function selectedQuotes(){return state.quotes.filter(q=>(!state.school||q.schoolId===state.school)&&(state.page!=='reviews'||['ENVIADA','EN_REVISION'].includes(q.status))&&(!state.filter||q.status===state.filter)&&(!state.query||[q.id,schoolName(q.schoolId),q.season].join(' ').toLowerCase().includes(state.query.toLowerCase())));}
function schoolName(id){return state.schools.find(s=>s.id===id)?.name||'Colegio';}
function quoteTable(qs){return qs.length?`<div class="table-wrap"><table><thead><tr><th>Folio / Colegio</th><th>Temporada</th><th>Libros / Piezas</th><th>Estado</th><th>Actualizada</th><th></th></tr></thead><tbody>${qs.map(q=>`<tr><td><strong>${esc(schoolName(q.schoolId))}</strong><span class="small muted">PC-${esc(q.id.slice(0,8).toUpperCase())}</span></td><td>${esc(q.season||'Sin temporada')}</td><td>${q.lineCount||0} títulos<br><span class="muted">${q.units||0} piezas</span></td><td>${badge(q.status)}</td><td>${esc(when(q.updated))}</td><td><button data-open="${esc(q.id)}">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay precotizaciones en esta vista.</div>';}
function wireOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQuote(b.dataset.open));}
function renderHome(){const qs=state.quotes,pending=qs.filter(q=>['ENVIADA','EN_REVISION'].includes(q.status)).length;$('content').innerHTML=`<div class="row between"><div><h1>Todo empieza en el colegio.</h1><p class="muted">Consulta tus propuestas y el siguiente paso de cada una.</p></div>${state.user.role!=='COMPRAS'?'<button class="primary" id="new">+ Nueva precotización</button>':''}</div><div class="stats"><div class="stat"><span>Colegios asignados</span><strong>${state.schools.length}</strong></div><div class="stat accent"><span>Pendientes de Compras</span><strong>${pending}</strong></div><div class="stat"><span>Con observaciones</span><strong>${qs.filter(q=>q.status==='OBSERVACIONES').length}</strong></div><div class="stat"><span>Aprobadas</span><strong>${qs.filter(q=>q.status==='APROBADA').length}</strong></div></div><div class="card"><div class="row between"><h2>Actividad reciente</h2><button id="all">Ver todas</button></div>${quoteTable(qs.slice(0,8))}</div><div class="grid two"><div class="card"><span class="eyebrow">01 · Promotor</span><h3 style="margin-top:12px">Captura y confirma</h3><p class="muted">Elige el colegio, agrega los libros y revisa las cantidades antes de enviar.</p></div><div class="card"><span class="eyebrow">02 · Compras</span><h3 style="margin-top:12px">Revisa y da seguimiento</h3><p class="muted">Verifica cada título y devuelve dudas al promotor o da el visto bueno.</p></div></div>`;if($('new'))$('new').onclick=()=>newQuote();$('all').onclick=()=>nav('quotes');wireOpen();}
function renderSchools(){const admin=state.user.role==='ADMIN';$('content').innerHTML=`<div class="row between"><div><h1>Colegios</h1><p class="muted">Un espacio para el historial de cada colegio.</p></div>${admin?'<button class="primary" id="addSchool">+ Registrar colegio</button>':''}</div><div id="schoolForm"></div><div class="grid three">${state.schools.map(s=>{const qs=state.quotes.filter(q=>q.schoolId===s.id);return `<div class="card school"><span class="eyebrow">${esc(s.promoter)}</span><h2 style="margin:12px 0">${esc(s.name)}</h2><p class="small muted">${esc(s.contact||'Sin contacto')}<br>${esc(s.phone||'Sin teléfono')}</p><div class="row between"><span class="small">${qs.length} precotizaciones</span><button data-school="${esc(s.id)}">Ver historial</button></div>${admin?`<button data-edit-school="${esc(s.id)}" style="margin-top:12px">Editar / reasignar</button>`:''}</div>`;}).join('')}</div>${!state.schools.length?'<div class="empty">No tienes colegios asignados. Administración debe registrarlos y asignar un promotor.</div>':''}`;if(admin){$('addSchool').onclick=()=>schoolForm();document.querySelectorAll('[data-edit-school]').forEach(b=>b.onclick=()=>schoolForm(state.schools.find(s=>s.id===b.dataset.editSchool)));}document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>nav('quotes',b.dataset.school));}
function schoolForm(s={}){const schoolId=s.id||uid();$('schoolForm').innerHTML=`<form id="saveSchool" class="card"><h2>${s.id?'Editar':'Registrar'} colegio</h2><div class="grid two">${[['name','Nombre del colegio',150],['contact','Nombre del contacto',150],['phone','Teléfono',40],['email','Correo',150],['address','Dirección',400]].map(([k,l,m])=>`<div><label for="s_${k}">${l}</label><input id="s_${k}" maxlength="${m}" value="${esc(s[k]||'')}" ${k==='name'?'required':''}></div>`).join('')}<div><label for="s_promoter">Promotor asignado</label><select id="s_promoter" required><option value="">Seleccionar</option>${state.users.filter(u=>u.role==='PROMOTOR'&&u.active==='SI').map(u=>`<option value="${esc(u.username)}" ${u.username===s.promoter?'selected':''}>${esc(u.name)} (${esc(u.username)})</option>`).join('')}</select></div></div><div class="actions"><button class="primary">Guardar colegio</button><button type="button" id="cancelSchool">Cancelar</button></div></form>`;$('cancelSchool').onclick=()=>{$('schoolForm').innerHTML='';state.dirty=false;};$('saveSchool').oninput=()=>state.dirty=true;$('saveSchool').onsubmit=async e=>{e.preventDefault();if(state.pending)return;state.pending=true;try{const school={id:schoolId};['name','contact','phone','email','address','promoter'].forEach(k=>school[k]=$('s_'+k).value);await api('saveSchool',{school});state.dirty=false;await load();toast('Colegio guardado.');}catch(err){toast(err.message,true);}finally{state.pending=false;}};}
function renderQuotes(){const reviews=state.page==='reviews';$('content').innerHTML=`<div class="row between"><div><h1>${reviews?'Bandeja de Compras':'Precotizaciones'}</h1><p class="muted">${reviews?'Verifica los títulos y cantidades antes de dar el visto bueno.':'Consulta y sigue cada propuesta por colegio.'}</p></div>${!reviews&&state.user.role!=='COMPRAS'?'<button class="primary" id="new">+ Nueva precotización</button>':''}</div><div class="toolbar"><input id="qSearch" placeholder="Buscar colegio, folio o temporada" value="${esc(state.query)}"><select id="qSchool"><option value="">Todos los colegios</option>${state.schools.map(s=>`<option value="${esc(s.id)}" ${s.id===state.school?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${!reviews?`<select id="qStatus"><option value="">Todos los estados</option>${Object.entries(labels).map(([s,l])=>`<option value="${s}" ${s===state.filter?'selected':''}>${l}</option>`).join('')}</select>`:''}</div><div class="card" id="quoteList">${quoteTable(selectedQuotes())}</div>`;const update=()=>{state.query=$('qSearch').value;state.school=$('qSchool').value;if($('qStatus'))state.filter=$('qStatus').value;$('quoteList').innerHTML=quoteTable(selectedQuotes());wireOpen();};$('qSearch').oninput=update;$('qSchool').onchange=update;if($('qStatus'))$('qStatus').onchange=update;if($('new'))$('new').onclick=()=>newQuote();wireOpen();}
function searchBox(){return `<form id="catalogSearch" class="row"><div style="flex:1;min-width:170px"><label for="bookQuery">Buscar en catálogo</label><input id="bookQuery" minlength="3" required value="${esc(state.catalogQuery)}" placeholder="Título, código, ISBN o autor"></div><div style="width:155px"><label for="bookField">Buscar por</label><select id="bookField">${[['titulo','Título'],['codigo_gonvill','Código Gonvill'],['isbn','ISBN'],['autor','Autor']].map(([v,l])=>`<option value="${v}" ${v===state.catalogField?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" style="align-self:end">Buscar</button></form><p class="small muted">Mínimo 3 caracteres. Código e ISBN: coincidencia exacta; título y autor: texto parcial. Se muestran hasta 50 coincidencias.</p><div id="bookResults" class="search-results"></div>`;}
function wireCatalog(add){$('catalogSearch').onsubmit=async e=>{e.preventDefault();state.catalogQuery=$('bookQuery').value.trim();state.catalogField=$('bookField').value;const b=e.target.querySelector('button');b.disabled=true;$('bookResults').textContent='Buscando en el catálogo…';try{const r=await api('catalog',{query:state.catalogQuery,field:state.catalogField});state.books=r.items;$('bookResults').innerHTML=(r.more?'<div class="notice">Hay más resultados. Agrega más palabras para precisar la búsqueda.</div>':'')+(r.items.length?r.items.map((x,i)=>`<div class="result"><div><strong>${esc(x.title)}</strong><div class="small muted">${esc(x.code)} · ISBN ${esc(x.isbn||'sin ISBN')}<br>${esc(x.author||'Autor no indicado')}</div></div>${add?`<button type="button" data-book="${i}">+ Agregar</button>`:''}</div>`).join(''):'<div class="empty">No hay coincidencias. Prueba otra búsqueda o registra un libro por validar.</div>');document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>addBook(state.books[Number(b.dataset.book)]));}catch(err){$('bookResults').textContent=err.message;}finally{b.disabled=false;}};}
function renderCatalog(){$('content').innerHTML=`<h1>Catálogo de libros</h1><p class="muted">La referencia para armar tus precotizaciones.</p><div class="notice info">Aparecer en catálogo no garantiza disponibilidad ni precio. Compras verificará si el título se puede manejar.</div><div class="card">${searchBox()}</div>`;wireCatalog(false);}
function newQuote(){if(!state.schools.length){toast('Primero registra y asigna un colegio.',true);return;}state.quote={id:uid(),version:0,schoolId:state.school||state.schools[0].id,author:state.user.username,status:'BORRADOR',season:'2026–2027',neededDate:'',notes:'',contact:'',billingRequired:false,billing:'',specialConditions:'',confirmed:false,lines:[],history:[]};state.dirty=false;state.page='editor';render();}
async function openQuote(id){try{state.quote=await api('getQuote',{id});state.dirty=false;state.page='editor';render();}catch(err){toast(err.message,true);}}
function editable(){const q=state.quote;return ['BORRADOR','OBSERVACIONES'].includes(q.status)&&(state.user.role==='ADMIN'||(state.user.role==='PROMOTOR'&&q.author===state.user.username));}
function reviewable(){return ['ENVIADA','EN_REVISION'].includes(state.quote.status)&&['ADMIN','COMPRAS'].includes(state.user.role);}
function field(k,l,type='text',max=200){const q=state.quote,edit=editable();return `<div><label for="f_${k}">${l}</label><input id="f_${k}" type="${type}" value="${esc(q[k]||'')}" maxlength="${max}" ${edit?'':'disabled'}></div>`;}
function renderEditor(){const q=state.quote,edit=editable(),review=reviewable();$('content').innerHTML=`<div class="row between"><div><span class="eyebrow">PC-${esc(q.id.slice(0,8).toUpperCase())} · Versión ${q.version}</span><h1>${esc(schoolName(q.schoolId))}</h1><p class="muted">${esc(q.author)} ${q.updated?'· '+esc(when(q.updated)): '· Aún no guardada'}</p></div><div>${badge(q.status)} <button class="no-print" id="back">Volver</button></div></div><div class="steps no-print"><span class="${edit?'current':''}">1. Captura y confirmación</span><span class="${['ENVIADA','EN_REVISION'].includes(q.status)?'current':''}">2. Revisión de Compras</span><span class="${q.status==='APROBADA'?'current':''}">3. Visto bueno</span></div>${q.reviewNote?`<div class="notice"><strong>Respuesta de Compras:</strong> ${esc(q.reviewNote)}</div>`:''}<div class="card"><div class="section-label">Datos de la precotización</div><div class="grid three"><div><label for="f_schoolId">Colegio</label><select id="f_schoolId" ${edit&&!q.version?'':'disabled'}>${state.schools.map(s=>`<option value="${esc(s.id)}" ${s.id===q.schoolId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>${field('season','Temporada escolar','text',50)}${field('neededDate','Fecha requerida','date',10)}${field('contact','Contacto en colegio','text',150)}</div><div class="grid two" style="margin-top:18px"><div><label for="f_notes">Notas del promotor</label><textarea id="f_notes" maxlength="2000" ${edit?'':'disabled'}>${esc(q.notes)}</textarea></div><div><label for="f_specialConditions">Descuentos o condiciones solicitadas</label><textarea id="f_specialConditions" maxlength="1200" ${edit?'':'disabled'}>${esc(q.specialConditions)}</textarea><span class="small muted">Se registran para revisión; esta versión no autoriza descuentos.</span></div></div><label class="check" style="margin-top:15px"><input type="checkbox" id="f_billingRequired" ${q.billingRequired?'checked':''} ${edit?'':'disabled'}> Requiere facturación</label><label for="f_billing">Datos / referencia de facturación</label><textarea id="f_billing" maxlength="1500" ${edit?'':'disabled'} placeholder="Captura solo la información necesaria para el piloto.">${esc(q.billing)}</textarea></div>${edit?`<div class="card no-print"><div class="row between"><h2>Agregar libros</h2><button id="manual">+ Libro por validar</button></div>${searchBox()}<div id="manualForm"></div></div>`:''}<div class="card"><div class="row between"><h2>Libros solicitados</h2><span class="pill">${q.lines.length} renglones · <span id="unitCount">${q.lines.reduce((s,x)=>s+x.quantity,0)}</span> piezas</span></div><p class="small muted">El catálogo no contiene precios. Esta precotización registra títulos y cantidades.</p><div class="table-wrap"><table><thead><tr><th>Libro</th><th>Grado / grupo</th><th>Cantidad</th>${edit?'<th>Nota / acción</th>':'<th>Dictamen de Compras</th><th>Cantidad autorizada</th><th>Observación de Compras</th>'}</tr></thead><tbody>${q.lines.map((x,i)=>`<tr><td class="title"><strong>${esc(x.title)}</strong><span class="small muted">${esc(x.code||'Sin código')} · ${esc(x.isbn||'Sin ISBN')}</span>${x.manual?'<span class="pill OBSERVACIONES">Por validar</span>':''}${edit&&x.buyerNote?`<span class="small bad">Compras: ${esc(x.buyerNote)}</span>`:''}</td><td>${edit?`<input aria-label="Grado del libro ${i+1}" data-line="${i}" data-key="grade" maxlength="80" value="${esc(x.grade)}">`:esc(x.grade||'—')}</td><td>${edit?`<input type="number" aria-label="Cantidad del libro ${i+1}" min="1" max="100000" step="1" data-line="${i}" data-key="quantity" value="${x.quantity}">`:x.quantity}</td>${edit?`<td><input aria-label="Nota del libro ${i+1}" data-line="${i}" data-key="note" maxlength="600" value="${esc(x.note)}"><button type="button" class="danger" data-remove="${i}" style="margin-top:8px">Quitar</button></td>`:`<td>${review?`<select aria-label="Dictamen del libro ${i+1}" data-line="${i}" data-key="decision">${[['PENDIENTE','Pendiente'],['APROBADO','Aprobado'],['NO_MANEJABLE','No manejable'],['POR_ACLARAR','Por aclarar']].map(([d,l])=>`<option value="${d}" ${d===x.decision?'selected':''}>${l}</option>`).join('')}</select>`:esc(x.decision||'PENDIENTE')}<span class="small muted">${esc(x.note)}</span></td><td>${review?`<input aria-label="Cantidad autorizada del libro ${i+1}" type="number" min="0" max="${x.quantity}" step="1" data-line="${i}" data-key="approvedQuantity" value="${x.approvedQuantity||0}">`:x.approvedQuantity||0}</td><td>${review?`<textarea aria-label="Observación del libro ${i+1}" maxlength="600" data-line="${i}" data-key="buyerNote">${esc(x.buyerNote)}</textarea>`:esc(x.buyerNote||'—')}</td>`}</tr>`).join('')}</tbody></table></div>${!q.lines.length?'<div class="empty">Agrega los primeros libros desde el catálogo.</div>':''}</div>${edit?`<div class="card no-print"><label class="check"><input id="confirmed" type="checkbox"> Confirmo que revisé los títulos, grados y cantidades con el colegio y quiero enviar esta precotización a Compras.</label><div class="actions"><button id="draft">Guardar borrador</button><button class="primary" id="send">Confirmar y enviar a Compras</button></div><p class="small muted" style="margin:12px 0 0">Al enviar se bloquea la captura. Si Compras devuelve observaciones, podrás corregir y volver a enviar.</p></div>`:''}${review?`<div class="card no-print"><h2>Resolución de Compras</h2><label for="reviewNote">Respuesta para el promotor</label><textarea id="reviewNote" maxlength="2000" placeholder="Motivo, dudas o cambios requeridos…">${esc(q.reviewNote)}</textarea><div class="actions"><button id="review">Guardar revisión</button><button id="observe">Devolver con observaciones</button><button class="danger" id="reject">Rechazar</button><button class="primary" id="approve">Dar visto bueno</button></div><p class="small muted">Para aprobar, todos los renglones deben estar aprobados con la cantidad solicitada. Si cambian cantidades, devuelve observaciones para que el promotor confirme una nueva versión.</p></div>`:''}<div class="actions no-print"><button id="print">Imprimir / guardar PDF</button><button id="export">Exportar detalle CSV</button></div><div class="card" style="margin-top:20px"><h2>Historial</h2><div class="history">${(q.history||[]).map(h=>`<p><strong>${esc(labels[h.to]||h.to)}</strong> · v${h.version}<br><span class="small muted">${esc(when(h.date))} · ${esc(h.user)}</span><br>${esc(h.note)}</p>`).join('')||'<span class="muted">El historial aparecerá al guardar.</span>'}</div></div>`;
 $('back').onclick=()=>nav('quotes',q.schoolId);$('print').onclick=()=>{if(state.dirty&&!confirm('El documento incluirá cambios todavía sin guardar. ¿Continuar?'))return;window.print();};$('export').onclick=exportCSV;
 if(edit){wireCatalog(true);$('manual').onclick=manualForm;['draft','send'].forEach(cmd=>$(cmd).onclick=()=>saveQuote(cmd));}
 if(review)['review','observe','reject','approve'].forEach(cmd=>$(cmd).onclick=()=>saveQuote(cmd));
 document.querySelectorAll('[id^="f_"]').forEach(el=>el.oninput=()=>{q[el.id.slice(2)]=el.type==='checkbox'?el.checked:el.value;state.dirty=true;});
 if($('reviewNote'))$('reviewNote').oninput=()=>{q.reviewNote=$('reviewNote').value;state.dirty=true;};
 document.querySelectorAll('[data-line]').forEach(el=>el.oninput=()=>{const x=q.lines[Number(el.dataset.line)],k=el.dataset.key;x[k]=['quantity','approvedQuantity'].includes(k)?Number(el.value):el.value;if(k==='decision'){x.approvedQuantity=x.decision==='APROBADO'?x.quantity:0;const input=document.querySelector(`[data-line="${el.dataset.line}"][data-key="approvedQuantity"]`);if(input)input.value=x.approvedQuantity;}if($('unitCount'))$('unitCount').textContent=q.lines.reduce((s,x)=>s+x.quantity,0);state.dirty=true;});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{q.lines.splice(Number(b.dataset.remove),1);state.dirty=true;renderEditor();});}
function addBook(book,manual=false){if(state.quote.lines.length>=120){toast('Máximo 120 renglones por precotización.',true);return;}state.quote.lines.push({...book,manual,quantity:1,grade:'',note:'',decision:'PENDIENTE',approvedQuantity:0,buyerNote:''});state.dirty=true;renderEditor();toast('Libro agregado. Captura su cantidad y grado.');}
function manualForm(){$('manualForm').innerHTML=`<form id="manualBook" style="margin-top:18px"><div class="notice">Compras tendrá que validar este libro antes de dar el visto bueno.</div><div class="grid two">${[['title','Título *'],['code','Código (si lo conoces)'],['isbn','ISBN (si lo conoces)'],['author','Autor']].map(([k,l])=>`<div><label for="m_${k}">${l}</label><input id="m_${k}" maxlength="${k==='title'?300: k==='author'?200:50}" ${k==='title'?'required':''}></div>`).join('')}</div><div class="actions"><button>Agregar libro por validar</button><button type="button" id="cancelManual">Cancelar</button></div></form>`;$('cancelManual').onclick=()=>$('manualForm').innerHTML='';$('manualBook').onsubmit=e=>{e.preventDefault();const b={};['title','code','isbn','author'].forEach(k=>b[k]=$('m_'+k).value.trim());addBook(b,true);};}
async function saveQuote(command){if(state.pending)return;const q=state.quote;if(command==='send'){q.confirmed=$('confirmed').checked;if(!q.confirmed){toast('Marca la confirmación antes de enviar.',true);return;}}if(['approve','reject','observe','send'].includes(command)&&!confirm({approve:'¿Dar el visto bueno final a esta precotización?',reject:'¿Rechazar esta precotización? No podrá editarse.',observe:'¿Devolver la precotización al promotor?',send:'¿Confirmar y enviar a Compras? La captura quedará bloqueada.'}[command]))return;
 state.pending=true;document.querySelectorAll('.actions button').forEach(b=>b.disabled=true);const requestId=uid();try{const result=await api('saveQuote',{quote:q,command,requestId});state.quote=result;state.dirty=false;await load();toast('Precotización guardada correctamente.');}catch(e){toast(e.message,true);if(state.user)renderEditor();}finally{state.pending=false;}}
function exportCSV(){const q=state.quote;const rows=[['folio','colegio','temporada','estado','codigo_gonvill','titulo','isbn','grado','cantidad','dictamen','cantidad_autorizada','nota_promotor','nota_compras'],...q.lines.map(x=>['PC-'+q.id.slice(0,8).toUpperCase(),schoolName(q.schoolId),q.season,labels[q.status],x.code,x.title,x.isbn,x.grade,x.quantity,x.decision,x.approvedQuantity,x.note,x.buyerNote])];const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const blob=new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Precotizacion_'+q.id.slice(0,8)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
// DEMOSTRACIÓN: adaptador local, sin credenciales ni conexión externa.
const demoBooks=[{code:'00100014',title:'INFIDELIDAD LA CONFIANZA TRAICIONADA',author:'SERRANO, LUCY',isbn:'9789681903930'},{code:'DEMO001',title:'MATEMÁTICAS 1 · LIBRO DEMOSTRATIVO',author:'EQUIPO DEMO',isbn:''},{code:'DEMO002',title:'ESPAÑOL 2 · LIBRO DEMOSTRATIVO',author:'EQUIPO DEMO',isbn:''},{code:'DEMO003',title:'ENGLISH STUDENT BOOK 3 · DEMO',author:'EQUIPO DEMO',isbn:''}];
function demoUser(role){return {username:role==='PROMOTOR'?'promotor.demo':role==='COMPRAS'?'compras.demo':'admin.demo',name:role==='PROMOTOR'?'Promotor de ejemplo':role==='COMPRAS'?'Compras de ejemplo':'Administración demo',role};}
function demoDB(){const raw=localStorage.getItem('gp_demo_v1');if(raw)return JSON.parse(raw);const d={schools:[{id:'demo-colegio-1',name:'Colegio de ejemplo',contact:'Contacto de prueba',phone:'',email:'',address:'',promoter:'promotor.demo'},{id:'demo-colegio-2',name:'Instituto de demostración',contact:'',phone:'',email:'',address:'',promoter:'promotor.demo'}],quotes:[]};localStorage.setItem('gp_demo_v1',JSON.stringify(d));return d;}
async function startDemo(){state.demo=true;state.user=demoUser('ADMIN');state.page='home';await load();}
async function demoApi(action,p){const d=demoDB();if(action==='bootstrap')return {user:state.user,schools:d.schools,quotes:d.quotes.map(q=>({...q,lines:undefined,history:undefined})).sort((a,b)=>b.updated.localeCompare(a.updated)),users:[{username:'promotor.demo',name:'Promotor de ejemplo',role:'PROMOTOR',active:'SI'}]};if(action==='catalog'){const field={titulo:'title',codigo_gonvill:'code',autor:'author',isbn:'isbn'}[p.field];return {items:demoBooks.filter(b=>b[field].toLowerCase().includes(p.query.toLowerCase())),more:false};}if(action==='getQuote')return structuredClone(d.quotes.find(q=>q.id===p.id));if(action==='saveSchool'){const i=d.schools.findIndex(s=>s.id===p.school.id);if(i<0)d.schools.push(p.school);else d.schools[i]=p.school;}
 if(action==='saveQuote'){const q=structuredClone(p.quote),i=d.quotes.findIndex(x=>x.id===q.id),old=i<0?null:d.quotes[i];if(old&&q.version!==old.version)throw Error('Otra pestaña modificó la precotización. Actualiza.');if(!q.lines.length||q.lines.some(x=>!Number.isInteger(x.quantity)||x.quantity<1))throw Error('Agrega libros con cantidades enteras mayores a cero.');if(p.command==='send'&&(!q.confirmed||!q.season))throw Error('Confirma la precotización e indica temporada.');if(['observe','reject'].includes(p.command)&&!q.reviewNote?.trim())throw Error('Escribe el motivo para el promotor.');if(p.command==='approve'&&q.lines.some(x=>x.decision!=='APROBADO'||x.approvedQuantity!==x.quantity))throw Error('Aprueba cada renglón con su cantidad solicitada.');if(['draft','send'].includes(p.command)){q.lines.forEach(x=>{x.decision='PENDIENTE';x.approvedQuantity=0;x.buyerNote='';});q.reviewNote='';}q.status={draft:'BORRADOR',send:'ENVIADA',review:'EN_REVISION',observe:'OBSERVACIONES',reject:'RECHAZADA',approve:'APROBADA'}[p.command];q.version=(old?.version||0)+1;q.updated=new Date().toISOString();q.lineCount=q.lines.length;q.units=q.lines.reduce((s,x)=>s+x.quantity,0);q.history=[...(old?.history||[]),{version:q.version,date:q.updated,user:state.user.username,from:old?.status||'NUEVA',to:q.status,note:q.reviewNote||'Guardado en demostración'}];if(i<0)d.quotes.push(q);else d.quotes[i]=q;localStorage.setItem('gp_demo_v1',JSON.stringify(d));return structuredClone(q);}localStorage.setItem('gp_demo_v1',JSON.stringify(d));return true;}
window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});
(async()=>{renderLogin();if(token)try{await load();}catch(e){toast(e.message,true);}})();
</script></body></html>
